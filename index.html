<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>終末盤戯</title>
<meta name="description" content="17×17の盤で魔王を詰ませる対戦ボードゲーム。救世主と縮退で盤が変わる。">
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="終末盤戯">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<!-- 紋章スプライト -->

    <symbol id="e-N" viewBox="0 0 100 100"><path class="inks" d="M50 12 L50 90" stroke-width="5" stroke-linecap="round"/><path class="ink" d="M28 30 L72 30 L72 52 C72 68 50 80 50 80 C50 80 28 68 28 52 Z"/><path class="cut" d="M50 34 L50 74 C50 74 33 64 33 52 L33 34 Z" opacity=".55"/><rect class="ink" x="38" y="20" width="24" height="5" rx="1"/></symbol>

    <symbol id="i-cpu" viewBox="0 0 48 48"><circle cx="24" cy="24" r="17" fill="none" stroke="#d9b56c" stroke-width="1.5"/><path d="M14 34 L16 18 L21 24 L24 14 L27 24 L32 18 L34 34 Z" fill="#d9b56c"/></symbol>
    <symbol id="i-pvp" viewBox="0 0 48 48"><circle cx="17" cy="24" r="10" fill="url(#mw)" stroke="#79d4ff" stroke-width="1.2"/><circle cx="31" cy="24" r="10" fill="url(#mb)" stroke="#ff6b5c" stroke-width="1.2"/></symbol>

    <symbol id="i-tut" viewBox="0 0 48 48"><circle cx="24" cy="24" r="16" fill="none" stroke="#d9b56c" stroke-width="1.5"/><circle cx="24" cy="24" r="9" fill="none" stroke="#d9b56c" stroke-width="1.5"/><circle cx="24" cy="24" r="3" fill="#d9b56c"/></symbol>
    <symbol id="i-cont" viewBox="0 0 48 48"><path d="M16 12 L36 24 L16 36 Z" fill="#d9b56c"/></symbol>
  </defs>
</svg>

<!-- ===== タイトル ===== -->
<section class="screen on" id="scr-title" aria-label="タイトル">
  <svg class="sigil" viewBox="0 0 400 400" aria-hidden="true">
    <defs><path id="ring1" d="M200 200 m-170 0 a170 170 0 1 1 340 0 a170 170 0 1 1 -340 0"/><path id="ring2" d="M200 200 m-128 0 a128 128 0 1 1 256 0 a128 128 0 1 1 -256 0"/></defs>
    <g class="spin" fill="none" stroke="#d9b56c">
      <circle cx="200" cy="200" r="190" stroke-width=".6" opacity=".6"/>
      <circle cx="200" cy="200" r="182" stroke-width=".4" opacity=".4"/>
      <text font-family="Cinzel, serif" font-size="11" fill="#d9b56c" stroke="none" letter-spacing="5" opacity=".7"><textPath href="#ring1">ᚨᛈᛟᚲᚨᛚᛁᛈᛏᛖᚱ · ᛞᛖᚢᛋ · ᛋᚨᛚᚢᚨᛏᛟᚱ · ᛖᚾᛞ · ᛟᚠ · ᚦᛖ · ᛒᛟᚨᚱᛞ · ᚨᛈᛟᚲᚨᛚᛁᛈᛏᛖᚱ · ᛞᛖᚢᛋ · ᛋᚨᛚᚢᚨᛏᛟᚱ ·</textPath></text>
      <polygon points="200,40 338.6,280 61.4,280" stroke-width=".6" opacity=".5"/>
      <polygon points="200,360 61.4,120 338.6,120" stroke-width=".6" opacity=".5"/>
    </g>
    <g class="spin-r" fill="none" stroke="#d9b56c">
      <circle cx="200" cy="200" r="140" stroke-width=".5" opacity=".5"/>
      <circle cx="200" cy="200" r="116" stroke-width=".5" opacity=".35" stroke-dasharray="2 6"/>
      <text font-family="Cinzel, serif" font-size="9" fill="#d9b56c" stroke="none" letter-spacing="7" opacity=".55"><textPath href="#ring2">I · II · III · IV · V · VI · VII · VIII · IX · X · XI · XII · XIII · XIV · XV · XVI · XVII ·</textPath></text>
      <rect x="120" y="120" width="160" height="160" stroke-width=".5" opacity=".4"/>
      <rect x="120" y="120" width="160" height="160" stroke-width=".5" opacity=".4" transform="rotate(45 200 200)"/>
    </g>
  </svg>
  <div class="floor" aria-hidden="true"></div>
  <div class="logo">
    <span class="ruby" id="t-ruby"></span>
    <h1 id="t-title"></h1>
    <span class="rule"></span>
    <span class="tagline" id="t-tag"></span>
  </div>
  <div class="tap">タップして始める</div>
  <div class="ver" id="t-ver"></div>
</section>

<!-- ===== メニュー ===== -->
<section class="screen" id="scr-menu" aria-label="メニュー">
  <div class="content">
    <div class="mini-logo"><span id="m-ruby"></span><b id="m-title"></b></div>
    <button class="menu-btn primary" id="btn-continue" type="button" hidden>
      <span class="mi"><svg><use href="#i-cont"/></svg></span>
      <span><span class="mt">続きから</span><span class="ms" id="continue-desc">中断した対局を再開</span></span><span class="arrow">›</span>
    </button>
    <button class="menu-btn primary" id="btn-cpu" type="button">
      <span class="mi"><svg><use href="#i-cpu"/></svg></span>
      <span><span class="mt">CPU対戦</span><span class="ms">難易度と陣営を選んで1人で遊ぶ</span></span><span class="arrow">›</span>
    </button>
    <button class="menu-btn" id="btn-pvp" type="button">
      <span class="mi"><svg><use href="#i-pvp"/></svg></span>
      <span><span class="mt">2人対戦</span><span class="ms">1台の端末を交互に操作する</span></span><span class="arrow">›</span>
    </button>
    <button class="menu-btn" id="btn-tut" type="button">
      <span class="mi"><svg><use href="#i-tut"/></svg></span>
      <span><span class="mt">チュートリアル <span class="badge" id="tut-badge">はじめての方へ</span></span><span class="ms">5つのレッスンを実際の盤で試す</span></span><span class="arrow">›</span>
    </button>
    <button class="menu-btn" id="btn-rules" type="button">
      <span class="mi"><svg><use href="#i-book"/></svg></span>
      <span><span class="mt">遊び方</span><span class="ms">駒の動き・救世主・縮退・進化</span></span><span class="arrow">›</span>
    </button>
    <button class="menu-btn" id="btn-settings" type="button">
      <span class="mi"><svg><use href="#i-gear"/></svg></span>
      <span><span class="mt">設定</span><span class="ms">効果音・駒の表示・演出</span></span><span class="arrow">›</span>
    </button>
  </div>
</section>

<!-- ===== 対戦設定 ===== -->
<section class="screen" id="scr-setup" aria-label="対戦の設定">
  <div class="content">
    <div class="bar"><button class="icon-btn back" type="button" aria-label="戻る"><svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" fill="none" stroke="#d9b56c" stroke-width="2"/></svg></button><h2 id="setup-title">CPU対戦</h2></div>
    <div class="group" id="grp-lv">
      <h3>難易度</h3>
      <div class="choices" id="lv-choices">
        <button class="choice" type="button" data-lv="1"><span class="stars">◆◇◇</span><b>初級</b><small>1手先だけを見る。駒の動きを覚えたい人向け。</small></button>
        <button class="choice" type="button" data-lv="2"><span class="stars">◆◆◇</span><b>中級</b><small>相手の返し手まで読む。取られる駒は守る。</small></button>
        <button class="choice" type="button" data-lv="3"><span class="stars">◆◆◆</span><b>上級</b><small>3手先まで読む。救世主と縮退の駆け引きも狙う。</small></button>
      </div>
    </div>
    <div class="group" id="grp-side">
      <h3>あなたの陣営</h3>
      <div class="choices" id="side-choices">
        <button class="choice" type="button" data-side="0"><b>白・先手</b><small>先に動ける。魂ポイント0から。</small></button>
        <button class="choice" type="button" data-side="1"><b>黒・後手</b><small>後から動く。魂ポイント2から。</small></button>
        <button class="choice" type="button" data-side="r"><b>おまかせ</b><small>ランダムに決める。</small></button>
      </div>
    </div>
    <div class="group">
      <h3>持ち時間</h3>
      <div class="choices" id="timer-choices">
        <button class="choice" type="button" data-t="0"><b>なし</b><small>じっくり考えられる。</small></button>
        <button class="choice" type="button" data-t="1"><b>10秒切れ</b><small>1手10秒。時間内に指せなければ負け。</small></button>
      </div>
    </div>
    <button class="cta" id="btn-start-cpu" type="button">対局開始</button>
  </div>
</section>

<!-- ===== 遊び方 ===== -->
<section class="screen" id="scr-rules" aria-label="遊び方">
  <div class="content" style="flex:1; padding-bottom:0">
    <div class="bar"><button class="icon-btn back" type="button" aria-label="戻る"><svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" fill="none" stroke="#d9b56c" stroke-width="2"/></svg></button><h2>遊び方</h2></div>
    <div class="pages" id="pages"></div>
  </div>
  <div class="pager">
    <button class="ghost" id="pg-prev" type="button">前へ</button>
    <div class="dots" id="pg-dots"></div>
    <button class="ghost" id="pg-next" type="button">次へ</button>
  </div>
</section>

<!-- ===== 設定 ===== -->
<section class="screen" id="scr-settings" aria-label="設定">
  <div class="content">
    <div class="bar"><button class="icon-btn back" type="button" aria-label="戻る"><svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" fill="none" stroke="#d9b56c" stroke-width="2"/></svg></button><h2>設定</h2></div>
    <div class="row"><span class="lbl"><b>補助表示</b><small>狙われている駒、危ないマス、魔王の危機を知らせる</small></span><button class="toggle" id="set-assist" type="button" aria-label="補助表示"></button></div>
    <div class="row"><span class="lbl"><b>効果音</b><small>駒の移動・捕獲・降臨の音</small></span><button class="toggle" id="set-sound" type="button" aria-label="効果音"></button></div>
    <div class="row"><span class="lbl"><b>駒の表示</b><small>小さい画面では「文字」が見やすい</small></span>
      <span class="seg" id="set-piece"><button type="button" data-v="both">紋章＋文字</button><button type="button" data-v="kanji">文字</button><button type="button" data-v="icon">紋章</button></span></div>
    <div class="row"><span class="lbl"><b>移動できるマスを表示</b><small>駒を選んだときに光らせる</small></span><button class="toggle" id="set-targets" type="button" aria-label="移動できるマスを表示"></button></div>
    <div class="row"><span class="lbl"><b>演出</b><small>降臨や縮退のアニメーション</small></span>
      <span class="seg" id="set-fx"><button type="button" data-v="full">通常</button><button type="button" data-v="calm">控えめ</button></span></div>
    <div class="row"><span class="lbl"><b>盤の向き</b><small>2人対戦で手番の側を手前にする</small></span><button class="toggle" id="set-flip" type="button" aria-label="2人対戦で盤を回す"></button></div>
    <p class="note">ルールは漫画の説明をもとに再現しています。説明のない部分（救世主の降臨回数の数え方、3ターンの数え方など）は独自に決めた解釈です。</p>
  </div>
</section>

<!-- ===== 対局 ===== -->
<section class="screen" id="scr-game" aria-label="対局">
  <div class="g-wrap">
    <div class="g-top">
      <button class="icon-btn" id="btn-pause" type="button" aria-label="メニュー"><svg viewBox="0 0 24 24"><path d="M5 7 H19 M5 12 H19 M5 17 H19" stroke="#d9b56c" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="turn-pill" id="turn-pill"></div>
      <div class="clock" id="clock" hidden aria-label="残り時間"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" pathLength="100" class="trk"/><circle cx="18" cy="18" r="15.9" pathLength="100" class="ring" id="clock-ring"/></svg><b id="clock-n">10</b></div>
      <button class="icon-btn" id="btn-log" type="button" aria-label="棋譜"><svg viewBox="0 0 24 24"><path d="M6 4 H15 L19 8 V20 H6 Z M9 11 H16 M9 15 H16" fill="none" stroke="#d9b56c" stroke-width="1.6"/></svg></button>
    </div>
    <div class="tut" id="tut" hidden>
      <span class="kicker" id="tut-k"></span>
      <b id="tut-h"></b>
      <p id="tut-p"></p>
      <div class="tut-btns"><button class="ghost" id="tut-retry" type="button">やり直す</button><button class="ghost" id="tut-skip" type="button">スキップ</button><button class="cta small" id="tut-next" type="button" hidden>次のレッスンへ</button></div>
    </div>
    <div class="player" id="p-top"></div>
    <div class="g-mid">
      <div class="frame" id="frame">
        <svg class="frame-orn" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <g fill="none" stroke="#d9b56c" stroke-width=".25" opacity=".7">
            <rect x="1.4" y="1.4" width="97.2" height="97.2"/>
            <rect x="2.6" y="2.6" width="94.8" height="94.8" stroke-dasharray=".6 .8"/>
          </g>
          <g fill="#c23040" stroke="#f6e2ae" stroke-width=".15">
            <circle cx="50" cy="2" r=".9"/><circle cx="50" cy="98" r=".9"/><circle cx="2" cy="50" r=".9"/><circle cx="98" cy="50" r=".9"/>
            <circle cx="25" cy="2" r=".55"/><circle cx="75" cy="2" r=".55"/><circle cx="25" cy="98" r=".55"/><circle cx="75" cy="98" r=".55"/>
            <circle cx="2" cy="25" r=".55"/><circle cx="2" cy="75" r=".55"/><circle cx="98" cy="25" r=".55"/><circle cx="98" cy="75" r=".55"/>
          </g>
          <g font-family="Cinzel, serif" font-size="2.6" fill="#d9b56c" text-anchor="middle" dominant-baseline="central">
            <text x="2.1" y="2.3">Ω</text><text x="97.9" y="2.3">Ω</text><text x="2.1" y="97.8">Ω</text><text x="97.9" y="97.8">Ω</text>
          </g>
        </svg>
        <div class="sv-ribbons" id="sv-ribbons" aria-live="polite"></div>
        <div class="board" id="board" aria-label="盤面"></div>
        <div class="fx-layer" id="fx-layer"></div>
        <canvas id="sparks"></canvas>
      </div>
    </div>
    <div class="player" id="p-bot"></div>
    <p class="g-hint" id="hint"></p>
    <div class="g-tools"><button class="ghost small" id="btn-ref" type="button">ルール早見表</button></div>
  </div>
</section>

<!-- ===== オーバーレイ ===== -->
<div class="overlay" id="ov-pause" role="dialog" aria-label="メニュー">
  <div class="sheet">
    <h3>中断</h3>
    <button class="ghost" id="pa-resume" type="button">対局に戻る</button>
    <button class="ghost" id="pa-undo" type="button">1手戻す</button>
    <button class="ghost" id="pa-rules" type="button">遊び方を見る</button>
    <button class="ghost" id="pa-settings" type="button">設定</button>
    <button class="ghost danger" id="pa-resign" type="button">投了する</button>
    <div class="confirm" id="pa-resign-confirm" hidden><button class="ghost" id="pa-resign-no" type="button">やめる</button><button class="ghost danger" id="pa-resign-yes" type="button">投了</button></div>
    <button class="ghost" id="pa-title" type="button">メニューへ戻る（対局は保存）</button>
  </div>
</div>

<div class="overlay" id="ov-result" role="dialog" aria-label="対局結果">
  <div class="sheet result" id="result-sheet">
    <div class="big" id="r-big"></div>
    <div class="why" id="r-why"></div>
    <div class="stats" id="r-stats"></div>
    <button class="cta" id="r-again" type="button">もう一度</button>
    <button class="ghost" id="r-view" type="button">盤面を見る</button>
    <button class="ghost" id="r-menu" type="button">メニューへ</button>
  </div>
</div>

<div class="overlay ref" id="ov-ref" role="dialog" aria-label="ルール早見表">
  <div class="sheet ref-sheet">
    <h3>ルール早見表</h3>
    <div class="ref-body" id="ref-body"></div>
    <div class="confirm"><button class="ghost" id="ref-more" type="button">詳しい遊び方</button><button class="ghost" id="ref-close" type="button">閉じる</button></div>
  </div>
</div>

<div class="overlay" id="ov-log" role="dialog" aria-label="棋譜">
  <div class="sheet log-sheet">
    <h3>棋譜</h3>
    <ol class="log-list" id="log"></ol>
    <button class="ghost" id="log-close" type="button">閉じる</button>
  </div>
</div>

<div id="fx-savior" aria-hidden="true"><div class="rays"></div><div class="core"></div><div class="sv-stack"><div class="txt"><em>SALVATOR</em><b>救世主降臨</b><span id="sv-sub"></span></div><div class="sv-cards" id="sv-cards"></div></div><span class="sv-skip">タップでとばす</span></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="engine.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
